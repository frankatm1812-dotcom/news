name: News Briefing

on:
  schedule:
    # 北京时间 06:00 = UTC 22:00 (前一天)
    - cron: "0 22 * * *"
    # 北京时间 18:00 = UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
        run: python src/main.py

      - name: Commit daily archive
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/
          git diff --staged --quiet || git commit -m "Archive daily briefing $(date -u +%Y-%m-%d)"
          git push

      - name: Failure notification hint
        if: failure()
        run: |
          echo "::error::Briefing pipeline failed. A failure email is sent when SMTP secrets are configured."
