name: News Briefing

on:
  schedule:
    # 北京时间 07:15 = UTC 23:15（前一天）
    - cron: "15 23 * * *"
    # 北京时间 19:15 = UTC 11:15
    - cron: "15 11 * * *"
  workflow_dispatch:

# 同一 cron 重复入队时取消旧任务，避免一晚多发
concurrency:
  group: news-briefing-${{ github.event.schedule || format('manual-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate run window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — always send"
            exit 0
          fi

          H=$((10#$(TZ=Asia/Shanghai date +%H)))
          M=$((10#$(TZ=Asia/Shanghai date +%M)))
          echo "Beijing time: ${H}:$(printf '%02d' "$M")"

          # GitHub schedule 常延迟数小时（本仓库曾延迟至 22:49）。
          # 用半天窗口：上午场 00–11，下午场 12–23，避免延迟后被误跳过。
          if [ "$H" -lt 12 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Morning half — proceed (target 07:15)"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Evening half — proceed (target 19:15)"
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.window.outputs.send == 'true'
        run: pip install -r requirements.txt

      - name: Run briefing pipeline
        if: steps.window.outputs.send == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
        run: python src/main.py

      - name: Commit daily archive
        if: steps.window.outputs.send == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/
          git diff --staged --quiet || git commit -m "Archive daily briefing $(date -u +%Y-%m-%d)"
          git push

      - name: Failure notification hint
        if: failure() && steps.window.outputs.send == 'true'
        run: |
          echo "::error::Briefing pipeline failed. A failure email is sent when SMTP secrets are configured."
